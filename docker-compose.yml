version: "3.7"
services:
  app:
    build:
      args:
        user: email
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: php:8.4-fpm
    container_name: email-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - email

  nginx:
    image: nginx:alpine
    container_name: email-nginx
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - email

networks:
  email:
    driver: bridge
